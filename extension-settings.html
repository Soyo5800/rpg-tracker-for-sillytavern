<!-- RPG Tracker Native SillyTavern Settings Template -->
<div class="rpg-tracker-settings">
    <div class="inline-drawer">
        <!-- Drawer Title and Toggle Icon -->
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>RPG Tracker</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <!-- Drawer Content Container -->
        <div class="inline-drawer-content">
            <!-- Extension Enable/Disable Toggle Block -->
            <div class="rpg-tracker-settings_block flex-container"
                style="display: flex; align-items: center; gap: 8px;">
                <input id="rpg_tracker_enabled" type="checkbox" />
                <label for="rpg_tracker_enabled" style="cursor: pointer; user-select: none;">Enable RPG Tracker</label>
            </div>

            <!-- Horizontal Rule Divider -->
            <hr class="sysHR" />
        </div>
    </div>
</div>
